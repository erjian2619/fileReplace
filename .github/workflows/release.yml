name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build Windows executable
        shell: cmd
        run: build.bat --no-pause

      - name: Prepare release package
        shell: pwsh
        run: |
          $tag = "${{ github.run_number }}"
          $dist = "dist"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null

          Copy-Item "FileReplaceTool.exe" -Destination $dist
          Copy-Item "FileReplaceTool.manifest" -Destination $dist
          if (Test-Path "README.md") {
            Copy-Item "README.md" -Destination $dist
          }

          $zipName = "FileReplaceTool-main-$tag.zip"
          Compress-Archive -Path "$dist\*" -DestinationPath $zipName -Force

          "ZIP_NAME=$zipName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FileReplaceTool-main-${{ github.run_number }}
          path: |
            FileReplaceTool-*.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: main-${{ github.run_number }}
          name: Build main-${{ github.run_number }}
          files: |
            FileReplaceTool-*.zip
          generate_release_notes: true
