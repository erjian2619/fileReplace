name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build Windows executable
        shell: cmd
        run: build.bat --no-pause

      - name: Prepare release package
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ([string]::IsNullOrWhiteSpace($tag) -or $tag -eq "main") {
            $tag = "manual"
          }

          $dist = "dist"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null

          Copy-Item "FileReplaceTool.exe" -Destination $dist
          Copy-Item "FileReplaceTool.manifest" -Destination $dist
          if (Test-Path "README.md") {
            Copy-Item "README.md" -Destination $dist
          }

          $zipName = "FileReplaceTool-$tag.zip"
          Compress-Archive -Path "$dist\*" -DestinationPath $zipName -Force

          "ZIP_NAME=$zipName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FileReplaceTool-${{ github.ref_name || 'manual' }}
          path: |
            FileReplaceTool-*.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            FileReplaceTool-*.zip
          generate_release_notes: true
